# if you want to modify the config, please check the following tutorial first:
# https://robotwin-platform.github.io/doc/usage/configurations.html

render_freq: 0        # fix, offline render only 
episode_num: 50
use_seed: false
save_freq: 15
embodiment: [aloha-agilex]
language_num: 100
domain_randomization:
  random_background: false
  cluttered_table: false
  clean_background_rate: 1
  random_head_camera_dis: 0
  random_table_height: 0
  random_light: false
  crazy_random_light_rate: 0
camera:
  head_camera_type: D435
  wrist_camera_type: D435
  collect_head_camera: true
  collect_wrist_camera: false  # X-RISE does not use wrist camera input
data_type:
  rgb: true
  third_view: true    # for visualization
  depth: false        # We save point cloud instead of depth to save storage space.
  pointcloud: true
  combine: true       # [false]: head point cloud;  [true]: combine front, (left, right) and head point cloud.
  # observer: true    # Probably the same as third_view.
  endpose: true
  qpos: true
  mesh_segmentation: false
  actor_segmentation: false
pcd_down_sample_num: 1024
pcd_crop: true
save_path: ./data           # Where to save data when running collect_data.py
clear_cache_freq: 5
collect_data: true
eval_video_log: true        # Whether to save video when running eval.py